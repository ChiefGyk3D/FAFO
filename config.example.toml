# FAFO example configuration. Copy and edit. Every value here is a placeholder.
# Secrets (API or GitHub tokens, passwords, keys) never go in this file: FAFO reads them
# from environment variables, and rejects the file if it finds a secret-looking key.
# The only exceptions are token_env (the NAME of an environment variable) and key_path
# (a file path; the file is never read by the config).
#
# Sources that need no options (host, claude, codex, gemini) are on by default.
# ollama, runners and copilot are off until you add their table below.
#
# The blocks between the BEGIN and END marker lines are examples. A test removes the
# leading "# " from them and checks that the result loads and builds, so they cannot rot.
# Lines starting with "##" are explanations and stay comments.

# Where the collector writes the snapshot. Default when unset:
# ${XDG_RUNTIME_DIR:-~/.local/state}/fafo/snapshot.json
# snapshot_path = "~/.local/state/fafo/snapshot.json"

# Command arguments shown in the process view. Everything else is shown as <arg>.
show_args = ["exec", "resume", "--resume", "--model"]

# Which of the shown flags take a value. The token after such a flag is shown too, after
# credential masking and the 256-character cap (a masked or longer value shows as <redacted>).
# A flag in show_args but not listed here is boolean: the next token stays <arg>. In "safe"
# mode this works the same way. Each entry is a flag name such as "--model" (at most 32
# entries, letters, digits and - only); secret-named flags (token, key, password, ...) are
# refused. Default: ["--model", "--resume"].
# show_value_args = ["--model", "--resume"]

# Fold boring helper processes (sleep, tail, shells and the like) into one summary row per
# session, such as "+16 helpers (sleep x6, bash x4, cat x3)". A boring process still shows when
# it uses 5 percent CPU or more, or when something that is not boring runs below it. In the
# terminal UI, Enter or x on the summary row lists up to 256 of that session's helpers, followed
# by a row that counts the ones not shown.
collapse_helpers = true

# Program names (the basename of the first word of the command) that count as boring.
# Up to 64 names of 1-32 characters from A-Z a-z 0-9 . _ - ; this list is the default.
boring_procs = ["sleep", "tail", "bash", "sh", "zsh", "dash", "cat", "head", "wc", "grep", "timeout", "env", "true"]

# How much of each command line the process view shows.
#   "allowlist" (default): only the executable and show_args above.
#   "safe": also short bare words (status, run), flag names, and the base name of a script,
#           module or path (never its directory). The word after a flag (its value) stays
#           hidden unless the flag is in show_args; so do URLs, anything with @ : = quotes
#           or spaces, and secret-looking words. Residual: a bare word that is a positional
#           argument and does not follow a flag can still show.
# Security note: "safe" puts more of each command line on screen, in snapshots and in
# screenshots, so it is off by default. Anything else is a config error.
# args_mode = "allowlist"

# Every source table takes: enabled (true or false), interval_s and timeout_s
# (positive numbers, seconds).
[sources.host]
enabled = true
interval_s = 2
timeout_s = 5

[sources.claude]
enabled = true
interval_s = 2
timeout_s = 5
# Directory holding the Claude Code session registry. Default: ~/.claude/sessions
# sessions_dir = "~/.claude/sessions"
# What the TASK column shows for a session: "off" (state only), "activity" (the default: the
# last tool and a minimal object, such as "Bash: make" or "Edit: widget.py", plus "(5m ago)"
# once it is over two minutes old) or "prompt" (the
# first 60 characters of your last message). "prompt" masking is best effort (token shapes and
# keyword phrases), so it may still show other sensitive prose on screen and in screenshots;
# use it only if you are comfortable with that.
# task_labels = "activity"

## Claude quota: the 5-hour and weekly usage windows, read from a JSON cache file that another
## tool writes (FAFO never writes it). Off until this table exists; usage_cache is required.
## The file must be a regular file you own with mode 0600 (no group or other bits) in a
## directory you own that is not group or other writable, at most 64 KB, shaped like
##   {"windows": [{"label": "5h", "used_percent": 41.4, "resets_at": 1800007800, "captured_at": 1799999940}, ...]}
## label is "5h" or "weekly"; resets_at and captured_at are epoch seconds (resets_at may be null).
## A window whose captured_at is over 30 minutes old is shown as stale with its original age.
## A missing file shows as absent in doctor; a bad one shows only a reason class, never content.
#@ BEGIN example
# [sources.claude_quota]
# enabled = true
# usage_cache = "~/.cache/example/claude-usage.json"
#@ END example

[sources.codex]
enabled = true

[sources.gemini]
enabled = true

#@ BEGIN example
## Local LLM server (Ollama). Off until this table exists. url is required.
# [sources.ollama]
# enabled = true
# interval_s = 5
# timeout_s = 3
## Base URL of the server (http or https, no credentials, no query).
# url = "http://ai-server.example.invalid:11434"
## Optional: path of the admission log used to show queue depth and in-flight requests.
# admission_log = "/var/log/example-admission.log"
#@ END example

#@ BEGIN example-servers
## Several Ollama servers (up to 8), each polled on its own: one down never hides the others,
## its last rows stay and age. Use this form INSTEAD of url and admission_log above.
## name: 1-32 characters from A-Z a-z 0-9 . _ - and unique. A single url (above) is one server
## named "ollama". admission_log is optional per server.
## timeout_s covers one collect of all servers (they are polled in parallel): each server's
## poll (two requests) gets min(6, timeout_s minus 0.5) seconds, always less than timeout_s.
## The smallest accepted timeout_s for this source is 1 second; anything lower is refused.
# [sources.ollama]
# interval_s = 5
# timeout_s = 4
# [[sources.ollama.servers]]
# name = "gpu-box"
# url = "http://gpu.example.invalid:11434"
# admission_log = "/var/log/example-admission.log"
# [[sources.ollama.servers]]
# name = "laptop"
# url = "http://laptop.example.invalid:11434"
#@ END example-servers

#@ BEGIN example
## CI runners. Off until this table exists. repos is required.
# [sources.runners]
# enabled = true
# interval_s = 15
# timeout_s = 8
## Repositories whose Actions jobs are matched to runners (owner/name).
# repos = ["owner/name"]
## NAME of the environment variable that holds a read-only GitHub token (Actions: read).
## The value is read from the environment at call time; it is never stored or printed.
## Without it the runners source still works over ssh, without job details.
# token_env = "FAFO_GITHUB_TOKEN"
## Or a PATH (absolute) to a file that holds the token. The file is re-read when it changes,
## so a token that something else refreshes (GitHub App tokens last about an hour) keeps
## working. FAFO never creates, refreshes or stores the token. The file must be a regular
## file (not a symlink) owned by you, mode 0600 or tighter, at most 8 KB, holding only the
## token. When both are set the file wins; a missing file falls back to the variable.
# token_file = "/run/user/1000/fafo-github-token"
##
## One table per runner host.
# [[sources.runners.hosts]]
## Runner name as GitHub reports it.
# name = "runner-a"
## ssh alias or host used for the read-only load, memory and disk checks. Optional.
# ssh = "runner-a.example.invalid"
## Path of the private key file to offer (never read by FAFO itself). Needs ssh. Optional.
# key_path = "~/.ssh/id_example"
## Optional: only match jobs from these repositories.
# repos = ["owner/name"]
#@ END example

#@ BEGIN example
## Copilot cloud agent runs. Off until this table exists. repos is required.
# [sources.copilot]
# enabled = true
# interval_s = 30
# timeout_s = 10
## Repositories to look at (owner/name).
# repos = ["owner/name"]
## NAME of the environment variable that holds a read-only GitHub token.
## If neither it nor token_file is set the source is skipped and doctor reports it as absent.
# token_env = "FAFO_GITHUB_TOKEN"
## Or a PATH (absolute) to a file that holds the token. The file is re-read when it changes,
## so a token that something else refreshes (GitHub App tokens last about an hour) keeps
## working. FAFO never creates, refreshes or stores the token. The file must be a regular
## file (not a symlink) owned by you, mode 0600 or tighter, at most 8 KB, holding only the
## token. When both are set the file wins; a missing file falls back to the variable.
# token_file = "/run/user/1000/fafo-github-token"
## Workflow paths you have verified as Copilot coding-agent sessions. Optional.
# session_paths = ["dynamic/agents/example"]
#@ END example

# Hostnames and IPs are replaced by these aliases before anything is written.
[aliases]
"ai-server.example.invalid" = "ai-server"
"runner-a.example.invalid" = "runner-a"
"192.0.2.10" = "runner-b"
