[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fafo"
dynamic = ["version"]
description = "Read-only observer of AI coding agents, local LLM servers and CI runners."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "psutil==7.2.2",   # released 2026-01-28
    "textual==8.2.8",  # released 2026-06-30
    "httpx==0.28.1",   # released 2024-12-06; 0.29.0 (2026-11-26) is under the 7 day hold
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",   # released 2026-10-27
    "ruff==0.17.5",    # released 2026-11-12
]

[project.scripts]
fafo = "fafo.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fafo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
